name: enum_map_gen
description: >-
  A generator for enum_map package,
  a Map with compile-time check that every enum value has an entry in it.

repository: https://github.com/alexeyinkin/dart-enum-map
version: 0.3.2

environment:
  sdk: '>=2.18.1 <4.0.0'

dependencies:
  analyzer: '>=8.1.1 <15.0.0'
  build: '>=3.0.0 <5.0.0'
  enum_map: ^0.3.0
  meta: ^1.7.0
  source_gen: '>=4.0.1 <5.0.0'

dev_dependencies:
  build_config: ^1.1.0
  source_gen_test: ^1.3.2
  test: ^1.21.6
  total_lints: ^3.0.0
